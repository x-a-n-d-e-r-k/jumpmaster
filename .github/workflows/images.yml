name: Images

# Builds every image without pushing, then runs the image smoke test and the trooper e2e against
# the fake Claude CLI. Later tasks add e2e cases (presets, egress, verification, the doctor drop).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Record the Docker Engine
        run: |
          {
            echo '### Docker Engine'
            echo '```'
            docker version
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build the images (no push)
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          for image in server stick trooper; do
            docker build --build-arg SOURCE_URL="$SOURCE_URL" -t "jumpmaster-${image}:dev" -f images/${image}/Dockerfile .
          done
      - name: Image smoke test
        run: images/smoke.sh
      - name: Trooper e2e
        env:
          E2E_REPO: ${{ github.repository }}
        run: images/trooper/e2e/run.sh
