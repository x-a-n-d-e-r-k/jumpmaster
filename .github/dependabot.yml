version: 2
updates:
  # Keep pinned GitHub Actions current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # Base-image digests in the shipped Dockerfiles (FROM ...@sha256:...).
  - package-ecosystem: docker
    directories:
      - "/images/*"
      - "/images/trooper/presets/*"
    schedule:
      interval: weekly
    groups:
      images:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  # The Claude CLI the trooper image installs with npm ci.
  - package-ecosystem: npm
    directory: /images/trooper/claude
    schedule:
      interval: weekly
