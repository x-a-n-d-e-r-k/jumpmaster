version: 2
updates:
  # Keep pinned GitHub Actions current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # Base-image digests in the shipped Dockerfiles (FROM ...@sha256:...).
  # Dependabot rewrites FROM lines only: a Node digest bump also needs each preset's
  # `ARG BASE=` placeholder updated by hand (images/images.test.ts says which).
  - package-ecosystem: docker
    directories:
      - "/images/*"
      - "/images/trooper/presets/*"
    schedule:
      interval: weekly
    ignore:
      # The images run the Node major CI tests with. A new major is a deliberate migration
      # (Node 25 dropped Corepack, which the trooper's pnpm/yarn shims come from), not a bump.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      # The jvm preset ships an LTS JDK (21). Dependabot offers the newest major, LTS or not
      # (24 is not); moving to the next LTS is a deliberate change to the preset and its test.
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
    groups:
      images:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  # The Claude CLI the trooper image installs with npm ci.
  - package-ecosystem: npm
    directory: /images/trooper/claude
    schedule:
      interval: weekly
